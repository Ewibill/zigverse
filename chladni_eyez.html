<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chladni - eyeZ</title>
<meta name="description" content="Sand on a singing plate. Hold to play the plate; every note draws its own figure.">
<meta property="og:title" content="Chladni - a Zigverse study">
<meta property="og:description" content="Sand on a singing plate. Hold to play it; every note draws its own figure.">
<meta name="theme-color" content="#030406">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chladni">
<link id="icon" rel="apple-touch-icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #030406; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #hud { position: fixed; left: 14px; top: 12px; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #8a93a3; letter-spacing: .02em; pointer-events: none; white-space: pre; }
  #hud b { color: #d8dde6; font-weight: 600; letter-spacing: .12em; }
  .phone #hud { top: calc(env(safe-area-inset-top) + 52px); font-size: 10.5px; white-space: pre-wrap; right: 14px; }
  #intro, #hint { position: fixed; left: 0; right: 0; text-align: center; pointer-events: none; color: #c9cfd9; font: 300 15px/1.5 -apple-system, "Segoe UI", Helvetica, sans-serif; letter-spacing: .04em; transition: opacity 2.4s ease; opacity: 0; }
  #intro { top: calc(env(safe-area-inset-top) + 62px); }
  #intro b { display: block; font-weight: 500; font-size: 13px; letter-spacing: .42em; color: #e8ecf2; margin-bottom: 2px; }
  #intro span, #hint { font-size: 13px; color: #8a93a3; }
  #hint { bottom: calc(env(safe-area-inset-bottom) + 26px); }
  #bar { position: fixed; right: 10px; top: calc(env(safe-area-inset-top) + 10px); display: flex; gap: 8px; }
  button { height: 34px; border-radius: 17px; border: 1px solid #39404c; background: rgba(3,4,6,.5); color: #8a93a3; padding: 0 14px; font: 13px -apple-system, "Segoe UI", Helvetica, sans-serif; letter-spacing: .06em; }
  #info { width: 34px; padding: 0; font: italic 15px Georgia, serif; display: none; order: 3; }
  .phone #info { display: block; }
  #medium { order: 1; } #listen { order: 2; }
  #listen.on { color: #e8ecf2; border-color: #8fa3b8; }
  .show { opacity: 1 !important; }
  .stage #bar { transition: opacity 1.2s ease; }
  .stage.idle #bar { opacity: 0; pointer-events: none; }
  .stage.idle, .stage.idle canvas { cursor: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="intro"><b>CHLADNI</b><span>sand on a singing plate</span></div>
<div id="hint">hold to play the plate &middot; slide up and down to change the note<br>side to side bends the figure &middot; double-tap shakes it clean<br>tap sand for rice &middot; or tap listen and sing</div>
<div id="bar">
<button id="medium" aria-label="what is on the plate">sand</button>
<button id="listen" aria-label="listen with the microphone">listen</button>
<button id="info" aria-label="about">i</button>
</div>
<script src="engine/zigcore.js"></script>
<script src="engine/zigchladni.js"></script>
<script src="engine/zigpitch.js"></script>
<script src="engine/zigshardgl.js"></script>
<script src="engine/zigchladnigpu.js"></script>
<script>
/* CHLADNI - the eyeZ host: the big screen. Same study (studies/chladni.js),
   but the sand is moved by the graphics card (engine/zigchladnigpu.js, the
   same law as engine/zigchladni.js): 150,000 grains of sand, 9,000 of rice.
   Stage manners: no text until H, F = full screen, the buttons and the cursor
   fade after 3 s without the mouse. If the GPU path cannot start, the CPU law
   takes over and the HUD says so. */
window.ZIG_CHLADNI = { engine: "gpu", count: { sand: 150000, rice: 9000 }, stage: true, dist: 5.9, pitch: 1.05 };
</script>
<script src="studies/chladni.js"></script>
</body>
</html>
