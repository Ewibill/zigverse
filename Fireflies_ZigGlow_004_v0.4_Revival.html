<script>
/* ===== inlined: engine/zigcore.js ===== */
/* ============================================================================
   ZigCore — the Zigverse engine (rendering-agnostic logic core)
   v0.2 · classic script · exposes a global `ZigCore`
   Load BEFORE the renderer and the species:  <script src="zigcore.js"><\/script>
   (classic script, not an ES module, so it works from file:// on venue nodes.)

   This file is the shared BRAIN — zero DOM, zero WebGL. Renderers (ZigGL / a
   future ZigCanvas) and species sit on top of it. Every organism inherits these
   levers on frame one; you only ever author what is genuinely new.

   Modules (extraction order):
     [x] util        — clamp / lerp / smoothstep / hash
     [x] rng         — deterministic seedable RNG (from Kelp/Jellyfish)
     [x] Perf        — EWI / Web-MIDI breath  → the source of life
     [x] Drive       — breath history + positional DELAY ("swell, not decay")  ← v0.2
     [x] Climate     — slow never-looping metabolism (incommensurate drifts)   ← v0.2
     [x] mode/clock  — 'live' | 'export' + Recorder (deterministic playback)  ← v0.2
     [ ] Flow/Field  — wandering current + queryable field
     [ ] Palette · Contagion · Gait · Agent · Depth · Director · Emerge · Probe
   (v0.2 modules appended below the v0.1 IIFE — extracted during the
    Murmuration build, 2026-07-16.)
   ========================================================================= */
(function (global) {
  "use strict";
  const ZigCore = global.ZigCore || (global.ZigCore = {});
  ZigCore.VERSION = "0.1.0";

  /* ---- util ------------------------------------------------------------- */
  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  const lerp  = (a, b, t) => a + (b - a) * t;
  const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a || 1e-6), 0, 1); return t * t * (3 - 2 * t); };
  ZigCore.util = { clamp, lerp, smoothstep,
    hash1: (n) => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); } };

  /* ---- rng — deterministic mulberry32 (shared by Kelp & Jellyfish) ------ */
  ZigCore.rng = function (seed) {
    let s = (seed >>> 0) || 0x9e3779b9;
    const next = () => { s |= 0; s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    next.seed = (v) => { s = v >>> 0; };
    return next;
  };

  /* ========================================================================
     ZigCore.Perf — the SOURCE OF LIFE.
     Human performance (EWI breath, via Web MIDI) becomes a normalized life-force
     signal every organism reads. Unified from three organisms:
       · Warm Butterfly : CC 2/7/11 → breath, pitch-bend, held notes, idle decay
       · Kelp / Jellyfish: CC2 + channel-pressure, "any CC" diagnostic, sim/idle
     Exposes:
       Perf.breath   0..1  smoothed life-force (live · simulated · idle auto-breath)
       Perf.breathRaw       pre-smoothing (feed the Drive integrator with this)
       Perf.bend     -1..1  pitch-bend (tension / lean)
       Perf.attack   0..1   decaying pulse on each note-on (intention)
       Perf.held     Set    currently-held notes (sustain / commitment)
       Perf.live     bool   a performer is connected & playing
     Call Perf.init(opts) once, Perf.update(dt, t) every frame.
     opts: { idle:true, breathCC:[2,7,11], anyCC:false, onStatus:fn }
     ==================================================================== */
  ZigCore.Perf = {
    breath: 0, breathRaw: 0, bend: 0, attack: 0, live: false, held: new Set(),
    heldT: new Map(), lastNote: -1, holdSec: 0,   // note start-times · most recent note-on · longest current hold (s)
    // diagnostics (for a monitor readout)
    inputs: "none", msgCount: 0, allMsg: 0, lastCC: "—", rawLog: [],
    _sim: 0, _last: 0, _midi: null,
    // gain/curve/smooth: the breath RESPONSE — how the instrument feels.
    // gain scales input · curve is gamma (>1 = more headroom at the top,
    // <1 = touchy) · smooth is the lag rate (higher = snappier)
    _opts: { idle: true, breathCC: [2, 7, 11], anyCC: false, onStatus: null,
             gain: 1, curve: 1, smooth: 7 },

    init(opts) {
      Object.assign(this._opts, opts || {});
      if (!global.navigator || !navigator.requestMIDIAccess) {
        this._status("Web MIDI unavailable (use Chrome)"); return Promise.resolve(false);
      }
      return navigator.requestMIDIAccess({ sysex: false }).then((acc) => {
        this._midi = acc;
        const bind = () => this._bindInputs();
        acc.onstatechange = bind; bind();
        return true;
      }).catch((err) => { this._status("MIDI blocked: " + err); return false; });
    },
    _bindInputs() {
      if (!this._midi) return;
      const names = [];
      this._midi.inputs.forEach((inp) => { inp.onmidimessage = (m) => this.onMsg(m); names.push(inp.name || "input"); });
      this.inputs = names.length ? names.join(", ") : "none";
      this._status(names.length ? ("EWI: " + this.inputs) : "EWI: awaiting device");
    },
    _status(s) { if (this._opts.onStatus) this._opts.onStatus(s); },

    onMsg(e) {
      const d = e && e.data; if (!d) return;
      this.allMsg++;
      // keep a small hex tail for diagnostics
      const hex = Array.from(d).map((b) => b.toString(16).padStart(2, "0")).join(" ");
      this.rawLog.unshift(hex); if (this.rawLog.length > 4) this.rawLog.pop();
      if (d.length < 2) return;
      const st = d[0] & 0xf0, o = this._opts, now = this._nowMs();
      if (st === 0xB0) {                         // control-change
        const cc = d[1], v = d[2] / 127;
        if (o.breathCC.indexOf(cc) >= 0) { this.breathRaw = Math.max(this.breathRaw * 0.55, v); this._hit("CC" + cc + " (breath)", now); }
        else if (o.anyCC) { this.breathRaw = v; this._hit("CC" + cc + " (mapped)", now); }
      } else if (st === 0xD0) {                  // channel pressure (aftertouch) — some EWIs send breath here
        this.breathRaw = d[1] / 127; this._hit("chan-pressure (breath)", now);
      } else if (st === 0xE0) {                  // pitch bend → tension/lean
        this.bend = (((d[2] << 7) | d[1]) - 8192) / 8192;
      } else if (st === 0x90 && d[2] > 0) {      // note on → intention
        this.held.add(d[1]); this.heldT.set(d[1], now); this.lastNote = d[1];
        this.attack = Math.max(this.attack, d[2] / 127); this.live = true; this._last = now;
      } else if (st === 0x80 || (st === 0x90 && d[2] === 0)) { // note off
        this.held.delete(d[1]); this.heldT.delete(d[1]);
      }
    },
    _hit(label, now) { this.lastCC = label; this.msgCount++; this.live = true; this._last = now; },
    _nowMs() { return (global.performance && performance.now) ? performance.now() : 0; },

    // hold-key / test breath (e.g. hold "B") — proves routing when the EWI is silent
    sim(v) { this._sim = clamp(v || 0, 0, 1); },

    update(dt, t) {
      const now = this._nowMs();
      // performer went quiet → let live breath fall away (Warm Butterfly's 1.6s window)
      if (this.live && now - this._last > 1600) { this.live = false; }
      if (this.live) { if (now - this._last > 120) this.breathRaw *= Math.max(0, 1 - dt * 1.2); }
      else if (this._sim > 0) { this.breathRaw = this._sim; }
      else if (this._opts.idle) {               // gentle auto-breath so the organism lives with no performer
        this.breathRaw = 0.22 + 0.16 * Math.sin((t || 0) * 0.28) + 0.08 * Math.sin((t || 0) * 0.09 + 1.3);
      } else { this.breathRaw *= Math.max(0, 1 - dt * 1.2); }
      // holdSec: the longest-running current hold — sustain as COMMITMENT
      let hs = 0; this.heldT.forEach((t0) => { const s = (now - t0) / 1000; if (s > hs) hs = s; });
      this.holdSec = hs;
      const o2 = this._opts;
      const shaped = Math.pow(clamp(this.breathRaw * (o2.gain || 1), 0, 1), o2.curve || 1);
      this.breath += (shaped - this.breath) * clamp(dt * (o2.smooth || 7), 0, 1);
      this.attack *= Math.max(0, 1 - dt * 4);   // intention pulse decays
      return this.breath;
    }
  };

})(typeof window !== "undefined" ? window : globalThis);

/* =============================================================================
   ZigCore v0.2 additions — Drive · Climate · Clock/Mode · Recorder
   Engine work promoted during the Murmuration build (2026-07).
     [x] Drive    — breath history + positional DELAY taps ("swell, not decay").
                    Drive.taps(out, maxDelay) fills a Float32Array for GPU upload:
                    each agent reads the swell at its OWN lag → the swell IS the wave.
     [x] Climate  — slow never-looping metabolism (seeded incommensurate drifts).
     [x] mode/clock — 'live' (wall clock) | 'export' (fixed dt, deterministic).
     [x] Recorder — capture breath/bend/attack timeline → deterministic playback.
   ========================================================================== */
(function (global) {
  "use strict";
  const ZigCore = global.ZigCore;
  if (!ZigCore) return;
  ZigCore.VERSION = "0.2.1";
  const clamp = ZigCore.util.clamp;

  /* ---- Drive — breath history + positional delay --------------------------
     Perf gives the NOW of the breath; Drive gives its PAST. An agent that reads
     tap(delay) where delay = its distance from a disturbance / waveSpeed is
     literally riding the performer's swell as a travelling wave.              */
  ZigCore.Drive = {
    depth: 8, hz: 60,                 // seconds of history · sample rate
    buf: null, n: 0, head: 0, energy: 0, _acc: 0,
    init(opts) {
      Object.assign(this, opts || {});
      this.n = Math.max(2, Math.ceil(this.depth * this.hz));
      this.buf = new Float32Array(this.n); this.head = 0; this.energy = 0; this._acc = 0;
    },
    update(dt) {
      if (!this.buf) this.init();
      const P = ZigCore.Perf, step = 1 / this.hz;
      this._acc += dt;
      while (this._acc >= step) {
        this._acc -= step;
        this.head = (this.head + 1) % this.n;
        this.buf[this.head] = P ? P.breath : 0;
      }
      // energy: slow integrator — the organism's accumulated vitality (swell, not decay)
      const target = P ? P.breath : 0;
      this.energy += (target - this.energy) * Math.min(1, dt * 0.5);
      return this.energy;
    },
    tap(delay) {                       // breath value `delay` seconds ago
      if (!this.buf) return 0;
      const s = clamp(Math.round(delay * this.hz), 0, this.n - 1);
      return this.buf[(this.head - s + this.n) % this.n];
    },
    taps(out, maxDelay) {              // evenly spaced taps 0..maxDelay → GPU uniform
      const m = out.length;
      for (let i = 0; i < m; i++) out[i] = this.tap(maxDelay * i / (m - 1 || 1));
      return out;
    }
  };

  /* ---- Climate — never-looping slow metabolism -----------------------------
     N channels of drift, each a sum of three incommensurate sines with seeded
     periods (minutes-scale). Never returns to its start; perfect for live.
     (Export loops handle this per-piece — see Output Targets doc.)           */
  ZigCore.Climate = {
    t: 0, channels: 6, value: [], _seeds: null,
    init(seed) {
      const r = ZigCore.rng(seed || 7); this._seeds = []; this.value = [];
      for (let i = 0; i < this.channels; i++) {
        this._seeds.push({
          f1: 1 / (45 + r() * 120), f2: 1 / (110 + r() * 300), f3: 1 / (23 + r() * 60),
          p1: r() * 6.283, p2: r() * 6.283, p3: r() * 6.283
        });
        this.value.push(0.5);
      }
    },
    update(dt) {
      if (!this._seeds) this.init();
      this.t += dt; const T = this.t * 6.283;
      for (let i = 0; i < this.channels; i++) {
        const s = this._seeds[i];
        this.value[i] = clamp(0.5
          + 0.25 * Math.sin(T * s.f1 + s.p1)
          + 0.15 * Math.sin(T * s.f2 + s.p2)
          + 0.10 * Math.sin(T * s.f3 + s.p3), 0, 1);
      }
    },
    drift(i) { return this.value.length ? this.value[i % this.channels] : 0.5; }
  };

  /* ---- mode + clock ---------------------------------------------------------
     'live'  : dt from the wall clock (clamped — a hitch never explodes physics)
     'export': fixed dt, decoupled from real time → flawless offline capture   */
  ZigCore.mode = "live";
  ZigCore.clock = {
    fixedDt: 1 / 60, frame: 0, _last: 0,
    tick(nowMs) {
      this.frame++;
      if (ZigCore.mode === "export") return this.fixedDt;
      if (!this._last) this._last = nowMs;
      const dt = (nowMs - this._last) / 1000; this._last = nowMs;
      return clamp(dt, 0, 0.05);
    },
    reset() { this._last = 0; this.frame = 0; }
  };

  /* ---- Recorder — a performance, captured -----------------------------------
     Records Perf per frame; playback overrides Perf deterministically, so an
     export render IS a captured performance, not a sim. Call update() BEFORE
     Perf.update() in the frame loop.                                          */
  ZigCore.Recorder = {
    mode: "off", track: [], _i: 0,
    start() { this.mode = "rec"; this.track = []; },
    stop() { const m = this.mode; this.mode = "off"; return m === "rec" ? this.track : null; },
    play(track) { if (track) this.track = track; this._i = 0; this.mode = "play"; },
    update() {
      const P = ZigCore.Perf; if (!P) return;
      if (this.mode === "rec") {
        this.track.push([P.breathRaw, P.bend, P.attack]);
      } else if (this.mode === "play" && this.track.length) {
        const f = this.track[this._i++ % this.track.length];
        P.breathRaw = f[0]; P.bend = f[1]; P.attack = Math.max(P.attack, f[2]);
        P.live = true; P._last = P._nowMs();   // hold the live window open
      }
    },
    toJSON() { return JSON.stringify(this.track); },
    fromJSON(s) { this.track = JSON.parse(s); }
  };

})(typeof window !== "undefined" ? window : globalThis);

/* =============================================================================
   ZigCore v0.3 additions — Temperament · Turnover
   The "make it breathe" layer (Scout review, Murmuration v1.7). Both are
   ENGINE laws, not species tricks — any organism (fish school, bat exodus,
   kelp, pollen cloud) inherits long-duration mood + gentle membership churn.
     [x] Temperament — minute-scale latent MOOD that quietly biases behavior.
                        Never announced. Deterministic (export-safe).
     [x] Turnover    — anonymous individuals quietly depart & rejoin. The
                        population stays constant; the membership drifts.
                        Preserves leaderlessness: wanderers are never focal.
   ========================================================================== */
(function (global) {
  "use strict";
  const ZigCore = global.ZigCore; if (!ZigCore) return;
  ZigCore.VERSION = "0.3.0";
  const clamp = ZigCore.util.clamp;

  /* ---- Temperament — "this flock feels different today" -------------------
     A few latent axes, each a slow bounded drift (sum of incommensurate sines
     on a MINUTES timescale). The organism maps these axes onto gentle biases
     of its own levers — never onto anything the viewer can name. speed=0
     freezes the mood (useful while judging). Deterministic from seed.        */
  ZigCore.Temperament = {
    axes: 3, speed: 1, t: 0, value: [0.5, 0.5, 0.5], _seeds: null,
    // characteristic periods (seconds) — 2 to 12 minutes, so a 10-20 min
    // session drifts through several unrepeating internal states
    init(seed, opts) {
      Object.assign(this, opts || {});
      const r = ZigCore.rng((seed || 0) ^ 0x7EE9);
      this._seeds = []; this.value = [];
      for (let i = 0; i < this.axes; i++) {
        this._seeds.push({
          f1: 1 / (150 + r() * 250), f2: 1 / (280 + r() * 440), f3: 1 / (95 + r() * 130),
          p1: r() * 6.283, p2: r() * 6.283, p3: r() * 6.283, bias: 0.4 + r() * 0.2
        });
        this.value.push(0.5);
      }
      return this;
    },
    update(dt) {
      if (!this._seeds) this.init(1);
      this.t += dt * this.speed; const T = this.t * 6.283;
      for (let i = 0; i < this.axes; i++) {
        const s = this._seeds[i];
        this.value[i] = clamp(s.bias
          + 0.30 * Math.sin(T * s.f1 + s.p1)
          + 0.16 * Math.sin(T * s.f2 + s.p2)
          + 0.09 * Math.sin(T * s.f3 + s.p3), 0, 1);
      }
    },
    axis(i) { return this.value[i] || 0; },
    set(i, v) { this.value[i] = clamp(v, 0, 1); }   // manual lock / testing
  };

  /* ---- Turnover — gentle membership churn ---------------------------------
     Every so often one anonymous individual quietly leaves (steers to a far
     target); a while later it drifts back from an unexpected edge and rejoins.
     Population is EXACTLY constant (same index re-flocks — the viewer can't
     tell, and there is nothing to follow). The kernel reads the wanderer
     slots and applies a gentle steer override; the departing agent's
     agitation is suppressed so it never becomes a focal event.
     update(dt, count, center[3], radius) → fill via getWanderers().          */
  ZigCore.Turnover = {
    slots: 4, interval: 110, departSec: 22, returnSec: 16, reach: 3.6,
    _t: 0, _timer: 0, _rng: null, _list: null,
    init(seed, opts) {
      Object.assign(this, opts || {});
      this._rng = ZigCore.rng((seed || 0) ^ 0x2A17);
      this._list = [];
      for (let i = 0; i < this.slots; i++) this._list.push({ active: false, idx: -1, phase: "", age: 0, tar: [0, 0, 0], str: 0 });
      this._timer = this.interval * 0.4;   // first departure comes fairly soon
      return this;
    },
    update(dt, count, center, radius) {
      if (!this._list) this.init(1);
      this._t += dt; this._timer -= dt;
      const r = this._rng;
      // schedule a new departure into a free slot
      if (this._timer <= 0 && count > 50) {
        const slot = this._list.find(s => !s.active);
        if (slot) {
          const th = r() * 6.283, ph = (r() - 0.5) * 1.6;
          slot.active = true; slot.phase = "leaving"; slot.age = 0; slot.str = 0.85;
          slot.idx = Math.floor(r() * count);
          slot.tar = [center[0] + Math.cos(th) * Math.cos(ph) * radius * this.reach,
                      center[1] + Math.sin(ph) * radius * (this.reach * 0.5) + radius * 0.6,
                      center[2] + Math.sin(th) * Math.cos(ph) * radius * this.reach];
        }
        this._timer = this.interval * (0.6 + r() * 0.9);
      }
      // advance each active slot
      for (const s of this._list) {
        if (!s.active) continue;
        s.age += dt;
        if (s.phase === "leaving" && s.age > this.departSec) {
          // turn for home from an unexpected edge
          const th = r() * 6.283, ph = (r() - 0.5) * 1.2;
          s.phase = "returning"; s.age = 0; s.str = 0.7;
          s.tar = [center[0] + Math.cos(th) * Math.cos(ph) * radius * 1.15,
                   center[1] + Math.sin(ph) * radius * 0.6 + radius * 0.3,
                   center[2] + Math.sin(th) * Math.cos(ph) * radius * 1.15];
        } else if (s.phase === "returning" && s.age > this.returnSec) {
          s.active = false; s.idx = -1; s.str = 0;   // release → normal cohesion re-flocks it
        }
      }
    },
    getWanderers(idxTar, meta) {   // idxTar,meta : Float32Array(slots*4)
      for (let i = 0; i < this.slots; i++) {
        const s = this._list[i], o = i * 4;
        if (s && s.active) {
          idxTar[o] = s.idx; idxTar[o + 1] = s.tar[0]; idxTar[o + 2] = s.tar[1]; idxTar[o + 3] = s.tar[2];
          meta[o] = s.str; meta[o + 1] = 0; meta[o + 2] = 0; meta[o + 3] = 0;
        } else { idxTar[o] = -1; meta[o] = 0; }
      }
    },
    activeCount() { return this._list ? this._list.filter(s => s.active).length : 0; }
  };

})(typeof window !== "undefined" ? window : globalThis);

/* =============================================================================
   ZigCore v0.4 addition — Pacemaker (the performer's clock)
   Promoted during the Fireflies/Pulse build, 2026-07.

   The anti-"generative art meh" law: the performer does not COMMAND the
   field's rhythm — they become one more oscillator in it, and the field must
   be PERSUADED. Pacemaker maintains a live phase/period estimate of the
   performer's rhythm from note-on times (a phase-locked loop, not a BPM
   detector), plus a CONFIDENCE that rises with steady playing and decays
   with silence or sloppiness. Confidence gates the coupling: play committed
   and the field locks to you; rush or drift and it slips back to its own
   pulse. Losing the field is possible — which is what makes winning it mean
   something.

   Usage: Pacemaker.init() once · Pacemaker.update(dt) every frame AFTER
   Perf.update (it watches Perf for onsets). Read:
     .phase 0..2π (your beat: 0 = the flash-point) · .period s · .bpm
     .confidence 0..1 · .pull (= confidence, gate for coupling) · .beat
   (Export note: Recorder tracks carry breath/bend/attack, not note times —
    pacemaker playback fidelity for export mode is a v2 item.)
   ========================================================================== */
(function (global) {
  "use strict";
  const ZigCore = global.ZigCore; if (!ZigCore) return;
  ZigCore.VERSION = "0.4.0";
  const clamp = ZigCore.util.clamp, lerp = ZigCore.util.lerp;

  ZigCore.Pacemaker = {
    phase: 0, period: 0.75, confidence: 0, pull: 0, beat: false, bpm: 80, omega: 8.38,
    flow: 0,                     // 0..1 streaming intensity — notes INSIDE a ribbon feed this
    _lastOnsetMs: -1, _lastT: -1, _prevT: -1, _pa: 0,
    /* RIBBON LISTENING (from Bill's own telemetry, 2026-07-19): his style is
       "play fast to go slow" — ~10 notes/s bundled into ribbons whose STARTS

  /* ========================================================================
     THE MEMORY GLASS — Afterimage law (v0.7 · 2026-07-20)
     TD's TOP-feedback idea absorbed as an engine capability: the glass itself
     remembers light. The world renders into an offscreen scene texture; a
     trail pass folds it into a persistence buffer by the PHOSPHOR LAW —
        trail = max(scene, prevTrail · decay − ε)
     max() means feedback can NEVER blow out (steady state = the scene
     itself); ε defeats unorm rounding so every ghost truly reaches black.
     decay is computed per frame from a time constant τ (seconds), so memory
     length is frame-rate independent. τ ≤ 0.02 → decay 0 → byte-exact
     passthrough. Opt-in via scene.attachAfterimage(a) / flock.attach…();
     worlds that never attach render EXACTLY as before. Every species —
     Halo Field, Lake, Fireflies, futures — inherits this with one call.
     ===================================================================== */
  const AFTERIMAGE_WGSL = `
struct AU { decay: f32, eps: f32, gate: f32, pad1: f32 };
@group(0) @binding(0) var<uniform> A: AU;
@group(0) @binding(1) var sceneT: texture_2d<f32>;
@group(0) @binding(2) var prevT: texture_2d<f32>;
struct FSQ { @builtin(position) cp: vec4f };
@vertex fn fsqVs(@builtin(vertex_index) vi: u32) -> FSQ {
  var o: FSQ; let xy = vec2f(f32((vi << 1u) & 2u), f32(vi & 2u)) * 2.0 - 1.0;
  o.cp = vec4f(xy, 0.0, 1.0); return o;
}
/* THE GATE (v0.7.1): the glass remembers FLASHES, not flight. Only pixels
   brighter than 'gate' enter memory, so ordinary moving bodies stay crisp
   (no contrails) while tolls, strikes and glints leave ghosts. gate 0 =
   remember everything (the original phosphor). */
@fragment fn trailFs(inp: FSQ) -> @location(0) vec4f {
  let px = vec2i(inp.cp.xy);
  let s = textureLoad(sceneT, px, 0).rgb;
  let p = textureLoad(prevT, px, 0).rgb;
  let keep = smoothstep(A.gate, A.gate + 0.22, max(s.r, max(s.g, s.b)));
  return vec4f(max(s * keep, p * A.decay - vec3f(A.eps)), 1.0);
}
/* the glass = the crisp scene, with the memory glowing behind it */
@fragment fn blitFs(inp: FSQ) -> @location(0) vec4f {
  let px = vec2i(inp.cp.xy);
  let s = textureLoad(sceneT, px, 0).rgb;
  let t = textureLoad(prevT, px, 0).rgb;
  return vec4f(max(s, t), 1.0);
}`;

  ZigWebGPU.createAfterimage = function (gpu, opts) {
    opts = opts || {};
    const device = gpu.device;
    const mod = device.createShaderModule({ code: AFTERIMAGE_WGSL });
    const mkPipe = (entry) => device.createRenderPipeline({
      layout: "auto",
      vertex: { module: mod, entryPoint: "fsqVs" },
      fragment: { module: mod, entryPoint: entry, targets: [{ format: gpu.format }] },
      primitive: { topology: "triangle-list" }
    });
    const trailPipe = mkPipe("trailFs");
    const blitPipe = mkPipe("blitFs");
    const ubuf = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    const uarr = new Float32Array(4);
    const after = {
      tau: opts.tau === undefined ? 1.2 : opts.tau,   // memory time-constant, seconds (≤0.02 = off)
      gate: opts.gate === undefined ? 0 : opts.gate,  // luminance floor for memory (0 = remember all · ~0.45 = only flashes)
      w: 0, h: 0, sceneTex: null, trail: [null, null], flip: 0,
      _bgTrail: [null, null], _bgBlit: [null, null], _sceneView: null,
      _ensure() {
        if (this.w === gpu.w && this.h === gpu.h && this.sceneTex) return;
        this.w = gpu.w; this.h = gpu.h;
        const mk = () => device.createTexture({
          size: [gpu.w, gpu.h], format: gpu.format,
          usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING
        });
        if (this.sceneTex) { this.sceneTex.destroy(); this.trail[0].destroy(); this.trail[1].destroy(); }
        this.sceneTex = mk(); this.trail = [mk(), mk()];        // fresh textures zero-clear: memory starts blank
        this._sceneView = this.sceneTex.createView();
        const tv = [this.trail[0].createView(), this.trail[1].createView()];
        for (let f = 0; f < 2; f++) {
          this._bgTrail[f] = device.createBindGroup({ layout: trailPipe.getBindGroupLayout(0), entries: [
            { binding: 0, resource: { buffer: ubuf } },
            { binding: 1, resource: this._sceneView },
            { binding: 2, resource: tv[f] }] });
          this._bgBlit[f] = device.createBindGroup({ layout: blitPipe.getBindGroupLayout(0), entries: [
            { binding: 1, resource: this._sceneView },
            { binding: 2, resource: tv[f] }] });
        }
        this._tv = tv;
      },
      /* the world draws into this instead of the swapchain */
      sceneView() { this._ensure(); return this._sceneView; },
      /* fold scene → trail, blit trail → glass. Recorded on the SAME encoder. */
      run(enc, swapView, dt) {
        const decay = this.tau <= 0.02 ? 0 : Math.exp(-(dt || 1 / 60) / this.tau);
        uarr[0] = decay; uarr[1] = 0.6 / 255; uarr[2] = this.gate;
        device.queue.writeBuffer(ubuf, 0, uarr);
        const next = 1 - this.flip;
        const tp = enc.beginRenderPass({ colorAttachments: [{ view: this._tv[next], clearValue: { r: 0, g: 0, b: 0, a: 1 }, loadOp: "clear", storeOp: "store" }] });
        tp.setPipeline(trailPipe); tp.setBindGroup(0, this._bgTrail[this.flip]); tp.draw(3); tp.end();
        const bp = enc.beginRenderPass({ colorAttachments: [{ view: swapView, clearValue: { r: 0, g: 0, b: 0, a: 1 }, loadOp: "clear", storeOp: "store" }] });
        bp.setPipeline(blitPipe); bp.setBindGroup(0, this._bgBlit[next]); bp.draw(3); bp.end();
        this.flip = next;
      }
    };
    return after;
  };

  /* ========================================================================
     ZIGFLOW — THE MEDIUM ITSELF (v0.8 · 2026-07-21)
     Until now the organisms flew through dead air: forces reached them only
     as wires (breath, waves, neighbors). ZigFlow gives the WORLD a body — a
     coarse 3-D velocity grid every flock in a scene shares:
       · ambient weather: analytic curl noise (divergence-free by
         construction — winds swirl, never drain or pile up), breath-scaled
       · wavefronts STIR it: a gong strike leaves rotating currents in the
         air that outlive the visible front (the medium remembers)
       · the avatar wakes it: the pilot's passage drags the air behind her
       · it forgets: exponential damping, τ ≈ 1/damp seconds
     Flocks with opts.flow sample the grid (trilinear) and lean toward the
     local wind. One flow per world; species without opts.flow compile the
     exact golden kernel. Deterministic — no RNG anywhere.
     ===================================================================== */
  const FLOW_WGSL = `
struct FU {
  dim: vec4f,                   // nx, ny, nz, cell size
  org: vec4f,                   // grid origin xyz, w dt
  par: vec4f,                   // x damp/s · y ambient gain · z time · w flock coupling (unused here)
  wav: vec4f,                   // x waveSpeed · y waveWidth · z waveLife · w breath
  imp: array<vec4f, 8>,         // xyz origin · w start time (<0 inactive)
  istr: array<vec4f, 8>,        // x strength ('meta' is WGSL-reserved)
  stir: vec4f,                  // avatar stir point xyz · w on/off
  stirV: vec4f,                 // avatar velocity xyz · w radius
};
@group(0) @binding(0) var<uniform> F: FU;
@group(0) @binding(1) var<storage, read_write> flow: array<vec4f>;

/* curl of a sinusoidal vector potential — divergence-free wind, proven in
   test/zigflow_ref.mjs by numeric divergence on the JS mirror */
fn curlN(p: vec3f, t: f32) -> vec3f {
  let s = 0.021;
  let a = p * s + vec3f(0.0, t * 0.03, 0.0);
  let cx = sin(a.x * 1.4 + 2.3) * (-sin(a.y * 1.2)) * 1.2 - cos(a.x * 0.9) * cos(a.z * 1.1 + 4.2) * 1.1;
  let cy = sin(a.y + 1.7) * (-sin(a.z * 1.3)) * 1.3 - cos(a.y * 1.2) * cos(a.x * 1.4 + 2.3) * 1.4;
  let cz = sin(a.z * 1.1 + 4.2) * (-sin(a.x * 0.9)) * 0.9 - cos(a.y + 1.7) * cos(a.z * 1.3);
  return vec3f(cx, cy, cz);
}

@compute @workgroup_size(64)
fn stirFlow(@builtin(global_invocation_id) gid: vec3<u32>) {
  let i = gid.x;
  let nx = u32(F.dim.x); let ny = u32(F.dim.y); let nz = u32(F.dim.z);
  if (i >= nx * ny * nz) { return; }
  let cx = i % nx; let cy = (i / nx) % ny; let cz = i / (nx * ny);
  let p = F.org.xyz + (vec3f(f32(cx), f32(cy), f32(cz)) + 0.5) * F.dim.w;
  let dt = F.org.w;
  var v = flow[i].xyz;
  v *= exp(-F.par.x * dt);                                        // the air forgets
  v += curlN(p, F.par.z) * F.par.y * (0.35 + 1.9 * F.wav.w) * dt; // weather breathes with the horn
  /* wavefronts stir rotating currents that OUTLIVE the visible ring */
  for (var m = 0u; m < 8u; m++) {
    let im = F.imp[m];
    if (im.w < 0.0) { continue; }
    let age = F.par.z - im.w;
    let life = max(F.wav.z, 0.5);
    if (age < 0.0 || age > life) { continue; }
    let d = p - im.xyz;
    let r = max(length(d), 0.001);
    let dir = d / r;
    let x = abs(r - F.wav.x * age);
    let w = max(F.wav.y, 1.0) * 1.6;
    let g = exp(-x * x / (2.0 * w * w)) * F.istr[m].x * exp(-age * (2.45 / life));
    let tang = normalize(cross(dir, vec3f(0.0, 1.0, 0.0)) + vec3f(0.0, 0.001, 0.0));
    v += (dir * 0.55 + tang * 0.85) * g * 7.0 * dt;
  }
  /* the pilot's wake — flying through the air drags it along */
  if (F.stir.w > 0.5) {
    let dd = p - F.stir.xyz;
    let sg = exp(-dot(dd, dd) / (2.0 * F.stirV.w * F.stirV.w));
    v += F.stirV.xyz * sg * 1.4 * dt;
  }
  let sp = length(v);
  if (sp > 14.0) { v *= 14.0 / sp; }                              // currents, not cannons
  flow[i] = vec4f(v, 0.0);
}`;

  ZigWebGPU.createFlow = function (gpu, opts) {
    opts = opts || {};
    const device = gpu.device;
    const EXT = opts.extent || 240, EXTY = opts.extentY || 240, CELL = opts.cell || 8;
    const NX = Math.ceil((EXT * 2) / CELL), NY = Math.ceil(EXTY / CELL), NZ = NX;
    const CELLS = NX * NY * NZ;
    const buf = device.createBuffer({ size: CELLS * 16, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
    const ubuf = device.createBuffer({ size: 88 * 4, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    const fu = new Float32Array(88);
    const mod = device.createShaderModule({ code: FLOW_WGSL });
    const pipe = device.createComputePipeline({ layout: "auto", compute: { module: mod, entryPoint: "stirFlow" } });
    const bg = device.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries: [
      { binding: 0, resource: { buffer: ubuf } },
      { binding: 1, resource: { buffer: buf } }] });
    return {
      buf, ubuf, NX, NY, NZ, CELL, EXT, EXTY,
      gain: opts.gain === undefined ? 1.2 : opts.gain,       // how hard wings lean toward the wind (1/s)
      damp: opts.damp === undefined ? 0.35 : opts.damp,      // the air's forgetting rate (τ ≈ 2.9 s)
      ambient: 1.0,                                          // weather amplitude (species scale it with breath)
      /* one stir of the world's air per frame. state supplies clock, waves,
         breath; stir (optional) = { x,y,z, vx,vy,vz, radius } for the wake. */
      frame(state, stir) {
        fu[0] = NX; fu[1] = NY; fu[2] = NZ; fu[3] = CELL;
        fu[4] = -EXT; fu[5] = 0; fu[6] = -EXT; fu[7] = state.dt || 1 / 60;
        fu[8] = this.damp; fu[9] = this.ambient; fu[10] = state.time || 0; fu[11] = this.gain;
        fu[12] = state.waveSpeed || 30; fu[13] = state.waveWidth || 8;
        fu[14] = state.waveLife || 3.5; fu[15] = state.breath || 0;
        for (let m = 0; m < 8; m++) {
          const im = state.impulses && state.impulses[m];
          const o = 16 + m * 4, o2 = 48 + m * 4;
          if (im && im.t0 >= 0) {
            fu[o] = im.o[0]; fu[o + 1] = im.o[1]; fu[o + 2] = im.o[2]; fu[o + 3] = im.t0;
            fu[o2] = im.strength;
          } else { fu[o + 3] = -1; fu[o2] = 0; }
        }
        if (stir) {
          fu[80] = stir.x; fu[81] = stir.y; fu[82] = stir.z; fu[83] = 1;
          fu[84] = stir.vx || 0; fu[85] = stir.vy || 0; fu[86] = stir.vz || 0; fu[87] = stir.radius || 7;
        } else { fu[83] = 0; }
        device.queue.writeBuffer(ubuf, 0, fu);
        const enc = device.createCommandEncoder();
        const cp = enc.beginComputePass();
        cp.setPipeline(pipe); cp.setBindGroup(0, bg); cp.dispatchWorkgroups(Math.ceil(CELLS / 64));
        cp.end();
        device.queue.submit([enc.finish()]);
      }
    };
  };

  /* ========================================================================
     THE MEMBRANE — elastic space (v0.10 · Scout's law, 2026-07-22)
     "The bubble is not the artwork. The bubble is the physics field."
     An invisible elastic sphere lives in the world: a damped wave equation
     on its surface (disturbances PROPAGATE — negotiations, not waves-in-
     lockstep), surface tension (every deformation carries cost; bulges
     shrink, tight curves relax, nothing oscillates forever), and Scout's
     TOPOLOGICAL MEMORY: the rest shape slowly becomes what the surface has
     lived (τ≈45 s), then forgets (τ≈220 s). The membrane is NEVER rendered.
     Flocks with opts.skin sample it and inherit its local geometry — the
     organisms reveal the field. Breath changes ELASTICITY, not shape: a
     performer changes the weather, not the geometry.
     Simulated on CPU (512 cells, trivial) → uploaded as a storage buffer;
     the pure step lives in ZigWebGPU.membraneStep for Node-side law proofs.
     ===================================================================== */
  /* pure physics — F: {u,v,mem,lap: Float32Array(nt*np), nt, np} · P: params */
  ZigWebGPU.membraneStep = function (F, dt, P) {
    const nt = F.nt, np = F.np, u = F.u, v = F.v, mem = F.mem, lap = F.lap;
    const c2 = P.c2, k = P.k, damp = P.damp, memW = P.memW, maxU = P.maxU;
    for (let t = 0; t < nt; t++) {
      for (let p = 0; p < np; p++) {
        const i = t * np + p;
        const pl = t * np + (p + np - 1) % np, pr = t * np + (p + 1) % np;
        const pt = (t > 0 ? t - 1 : 0) * np + p, pb = (t < nt - 1 ? t + 1 : nt - 1) * np + p;
        lap[i] = u[pl] + u[pr] + u[pt] + u[pb] - 4 * u[i];
        /* TOPOLOGICAL MEMORY acts on CURVATURE too: the remembered shape
           becomes the surface's rest GEOMETRY, not just a local pull — so a
           held dent stays a dent instead of diffusing flat. Steady state:
           u → memW·mem, exactly the lived shape, slowly forgotten. */
        const memLap = mem[pl] + mem[pr] + mem[pt] + mem[pb] - 4 * mem[i];
        const a = c2 * (lap[i] - memW * memLap) - k * (u[i] - memW * mem[i]) - damp * v[i];
        v[i] += a * dt;
      }
    }
    let mean = 0;
    for (let i = 0; i < nt * np; i++) {
      u[i] += v[i] * dt;
      if (u[i] > maxU) { u[i] = maxU; if (v[i] > 0) v[i] = 0; }
      if (u[i] < -maxU) { u[i] = -maxU; if (v[i] < 0) v[i] = 0; }
      mean += u[i];
    }
    mean /= nt * np;
    for (let i = 0; i < nt * np; i++) {
      u[i] -= mean * 0.02;                                     // the bubble keeps its volume
      mem[i] += (u[i] - mem[i]) * Math.min(1, dt / P.tauMem);  // the pillow remembers
      mem[i] *= Math.exp(-dt / P.tauForget);                   // …and slowly forgets
    }
  };

  ZigWebGPU.createMembrane = function (gpu, opts) {
    opts = opts || {};
    const device = gpu.device;
    const NT = opts.nt || 24, NP = opts.np || 48, CELLS = NT * NP;
    const C = opts.center || [0, 62, 0], R0 = opts.radius || 34;
    const F = { nt: NT, np: NP, u: new Float32Array(CELLS), v: new Float32Array(CELLS),
                mem: new Float32Array(CELLS), lap: new Float32Array(CELLS) };
    const buf = device.createBuffer({ size: CELLS * 16, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
    const ubuf = device.createBuffer({ size: 12 * 4, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    const cells = new Float32Array(CELLS * 4);
    const uarr = new Float32Array(12);
    return {
      buf, ubuf, F, C, R0, NT, NP,
      elastic: 0,                    // 0 = rigid (silence) · 1 = willing (full breath)
      attractW: 2.6, alignW: 1.9, stressGain: 0.55,
      sigma: 0, depth: 0,            // HUD telemetry: current deformation · memory depth
      /* a disturbance enters the surface at the nearest point */
      poke(x, y, z, str) {
        const d = [x - C[0], y - C[1], z - C[2]];
        const r = Math.hypot(d[0], d[1], d[2]) || 1;
        const th = Math.acos(Math.max(-1, Math.min(1, d[1] / r)));
        const ph = Math.atan2(d[2], d[0]);
        const ct = Math.min(NT - 1, Math.max(0, Math.floor(th / Math.PI * NT)));
        const cp = ((Math.floor((ph + Math.PI) / (2 * Math.PI) * NP)) % NP + NP) % NP;
        const s = (str || 0.8) * 26;
        for (let dt2 = -2; dt2 <= 2; dt2++) for (let dp = -2; dp <= 2; dp++) {
          const t = Math.min(NT - 1, Math.max(0, ct + dt2)), p = ((cp + dp) % NP + NP) % NP;
          F.v[t * NP + p] += s * Math.exp(-(dt2 * dt2 + dp * dp) / 2.5);
        }
      },
      frame(dt) {
        const e = this.elastic;
        /* breath is WEATHER: elasticity softens tension, quickens travel */
        ZigWebGPU.membraneStep(F, Math.min(dt, 1 / 30), {
          c2: 85 * (1.10 - 0.50 * e), k: 1.15 * (1 - 0.75 * e), damp: 0.50 * (1 - 0.40 * e),   // tension = fast waves + flat skin; breath softens BOTH
          memW: 0.60, tauMem: 30, tauForget: 220, maxU: R0 * 0.32
        });
        let sg = 0, dp = 0;
        for (let i = 0; i < CELLS; i++) {
          cells[i * 4] = F.u[i]; cells[i * 4 + 1] = F.v[i]; cells[i * 4 + 2] = F.lap[i]; cells[i * 4 + 3] = F.mem[i];
          const au = Math.abs(F.u[i]); if (au > sg) sg = au;
          const am = Math.abs(F.mem[i]); if (am > dp) dp = am;
        }
        this.sigma = sg; this.depth = dp;
        device.queue.writeBuffer(buf, 0, cells);
        uarr[0] = C[0]; uarr[1] = C[1]; uarr[2] = C[2]; uarr[3] = R0;
        uarr[4] = NT; uarr[5] = NP; uarr[6] = this.attractW; uarr[7] = this.alignW;
        uarr[8] = this.stressGain; uarr[9] = 0; uarr[10] = 0; uarr[11] = 0;
        device.queue.writeBuffer(ubuf, 0, uarr);
      }
    };
  };

  /* ========================================================================
     SCENE — a shared world many species draw into.
     Owns the camera (view uniform), the sky, and the shared depth/MSAA pass.
     Species call computeInto(encoder) then recordInto(pass); the scene
     sequences them so a fish school, a kelp forest and a murmuration can
     inhabit ONE tank with correct depth, one camera, one light. This is the
     engine's "installation" primitive — every layered piece inherits it.
     NB: the View struct here MIRRORS the one in the flock kernel; keep in sync.
     ===================================================================== */
  const SCENE_SKY_WGSL = `
struct View {
  viewProj: mat4x4f, camPos: vec4f, camRight: vec4f, camUp: vec4f, camFwd: vec4f,
  sunDir: vec4f, skyTop: vec4f, skyMid: vec4f, horizon: vec4f, ground: vec4f,
  sunCol: vec4f, birdDark: vec4f, birdLight: vec4f, render: vec4f, render2: vec4f, render3: vec4f,
};
@group(0) @binding(0) var<uniform> V: View;
struct SkyOut { @builtin(position) cp: vec4f, @location(0) uv: vec2f };
@vertex fn skyVs(@builtin(vertex_index) vi: u32) -> SkyOut {
  var o: SkyOut; let xy = vec2f(f32((vi << 1u) & 2u), f32(vi & 2u)) * 2.0 - 1.0;
  o.cp = vec4f(xy, 0.9999, 1.0); o.uv = xy; return o;
}
fn skyColor(dir: vec3f) -> vec3f {
  let y = dir.y;
  var col = mix(V.horizon.rgb, V.skyMid.rgb, smoothstep(-0.02, 0.28, y));
  col = mix(col, V.skyTop.rgb, smoothstep(0.22, 0.85, y));
  let s = max(dot(dir, normalize(V.sunDir.xyz)), 0.0);
  col += V.sunCol.rgb * (pow(s, 350.0) * 1.4 + pow(s, 24.0) * 0.35) * V.sunDir.w;
  if (y < 0.0) { col = mix(col, V.ground.rgb, smoothstep(0.0, -0.06, y)); }
  return col;
}
fn marineSnow(dir: vec3f) -> vec3f {
  let sp = dir.xy * 70.0 + vec2f(0.0, V.camPos.w * 0.5);
  let cell = floor(sp); let hh = fract(sin(dot(cell, vec2f(19.73, 83.11))) * 3571.31);
  let d = fract(sp) - 0.5; let mote = smoothstep(0.13, 0.0, length(d)) * step(0.86, hh);
  return vec3f(0.55, 0.62, 0.60) * mote * (0.35 + 0.65 * max(dir.y, 0.0));
}
fn waterColor(dir: vec3f) -> vec3f {
  let y = dir.y; let deep = V.skyTop.rgb; let mid = V.skyMid.rgb; let surf = V.horizon.rgb;
  var col = mix(mid, deep, smoothstep(0.0, -0.75, y));
  col = mix(col, surf, smoothstep(0.05, 0.85, y));
  let sd = normalize(V.sunDir.xyz); let s = max(dot(dir, sd), 0.0);
  col = mix(col, surf * 1.5 + V.sunCol.rgb * 0.35, smoothstep(0.82, 0.995, y));
  col += V.sunCol.rgb * pow(s, 90.0) * 0.6 * V.sunDir.w;
  let ang = atan2(dir.x, dir.z);
  let ripple = 0.55 + 0.45 * sin(ang * 16.0 + V.camPos.w * 0.35) * sin(ang * 6.3 - V.camPos.w * 0.21);
  col += V.sunCol.rgb * pow(max(y, 0.0), 1.4) * pow(s, 2.5) * ripple * V.render2.y;
  col += marineSnow(dir) * V.ground.w;
  return col;
}
@fragment fn skyFs(inp: SkyOut) -> @location(0) vec4f {

@group(0) @binding(1) var<storage, read> posIn: array<vec4f>;
@group(0) @binding(2) var<storage, read> velIn: array<vec4f>;
@group(0) @binding(3) var<storage, read> gridCount: array<u32>;
@group(0) @binding(4) var<storage, read> gridIdx: array<u32>;
@group(0) @binding(5) var<storage, read_write> posOut: array<vec4f>;

fn step(@builtin(global_invocation_id) gid: vec3<u32>) {

}`;

@fragment
fn skyFs(inp: SkyOut) -> @location(0) vec4f {
  let aspect = V.camRight.w; let tf = V.camUp.w;
  let dir = normalize(V.camFwd.xyz + V.camRight.xyz * inp.uv.x * tf * aspect + V.camUp.xyz * inp.uv.y * tf);
  if (V.render.x > 0.5) { return vec4f(waterColor(dir), 1.0); }
  return vec4f(skyColor(dir), 1.0);
}
/* ---- caustics — the dancing net of light (surface ripples as lenses) ---- */
fn caustic(p: vec2f, t: f32) -> f32 {
  let q = p * 0.14;
  var v = sin(q.x * 1.3 + t * 0.6) * sin(q.y * 1.1 - t * 0.5);
  v += 0.5 * sin(q.x * 2.7 - t * 0.42 + 1.3) * sin(q.y * 2.3 + t * 0.7);
  v += 0.25 * sin((q.x + q.y) * 3.9 + t * 0.9);
  return pow(clamp(v * 0.5 + 0.5, 0.0, 1.0), 3.0);
}

  var side = cross(fwd, vec3f(0.0, 1.0, 0.0));

  let h2 = fract(sin(f32(ii) * 71.7 + 3.1) * 24634.6345);

    let sideR = side * cb - up * sb;     // lateral axis

    // the smooth envelope grows the amplitude toward the tail — head barely moves.

@fragment
fn birdFs(inp: BirdOut) -> @location(0) vec4f {
  var col: vec3f;
  if (V.render.x > 0.5) {

       COUNTERSHADING: dark dorsal → silver flank → pale ventral (a fish is
       never one colour).  THE FLASH: the specular mirror glint (computed in
       the vertex from sun+eye against the flank) lights the flank to silver;
       boosted by agitation so a bright band travels with the wave. birdDark =
       flank body · birdLight = silver · sunCol tints the caught light.       */
    let back  = V.birdDark.rgb * 0.55;                          // dark back
    let flank = V.birdDark.rgb;                                 // mid flank
    let belly = mix(V.birdDark.rgb, vec3f(0.55, 0.60, 0.66), 0.75); // pale underside
    var body = mix(flank, back, smoothstep(0.15, 0.9, inp.dv));
    body = mix(body, belly, smoothstep(-0.15, -0.9, inp.dv));
    body *= inp.tone;
    // CAUSTICS: the dancing surface-light net plays over the flank, strongest
    // near the surface and fading into the deep.
    let caus = caustic(inp.wpos.xz + inp.wpos.y * 0.3, V.camPos.w) * (1.0 - inp.depth);
    body += V.sunCol.rgb * caus * V.render2.z;
    let flash = clamp(inp.shade, 0.0, 1.0);
    col = mix(body, V.birdLight.rgb, flash);                    // the mirror lights up
    col += V.sunCol.rgb * flash * 0.5;                          // the caught glint
    // IRIDESCENCE — thin-film structural colour: a shifting blue/green/violet/
    // rose sheen at grazing angles, strongest where light is already catching.
    let hue = 0.5 + 0.5 * cos(6.2831 * (inp.iri + vec3f(0.0, 0.33, 0.66)));
    let sheen = pow(clamp(inp.iri, 0.0, 1.0), 1.6) * (0.35 + 0.65 * flash);
    col += hue * sheen * V.render3.z;
    // BIOLUMINESCENCE (Act III / night): the school glows cold blue where it
    // MOVES — a gentle base breathing glow, punched up by agitation, so the
    // wave itself becomes a travelling light. render3.w = biolum gain.
    col += vec3f(0.13, 0.72, 0.98) * (0.20 + 0.80 * min(inp.agit * 1.5, 1.0)) * V.render3.w;
    // DEPTH-SHIFT: fish fade toward the water colour at their own depth —
    // shallow fish stay silver-bright, deep fish sink into blue.
    let waterAtDepth = mix(V.horizon.rgb, V.skyTop.rgb, inp.depth);
    col = mix(col, waterAtDepth, inp.depth * V.render2.w);
    // EYE — a dark spot on each flank near the head, LOD-faded so it only
    // resolves up close (at flock distance the ball stays one organism).
    // camFwd.w = eyeGain. object eye centre ≈ (0.52, 0.09) on the flank.
    let ex = (inp.obj.x - 0.52) * 1.3; let ey = inp.obj.y - 0.09;

    col = mix(col, vec3f(0.02, 0.02, 0.03), clamp(eye, 0.0, 1.0));
    col += vec3f(0.7, 0.75, 0.8) * smoothstep(0.03, 0.0, length(vec2f(ex + 0.02, ey - 0.02))) * inp.near * onFlank * V.camFwd.w * 0.6;  // catchlight
  } else {

    col += V.sunCol.rgb * (1.0 - inp.shade) * 0.18;             // rim of low sun on edge-on wings
  }

  return vec4f(col, 1.0);
}

            for (let k = 0; k <= HFSEG; k++) { P[k] = [px, py, pz]; LI[k] = 0.2 + 0.3 * p.scl; WI[k] = g.w * (1 - k / HFSEG * 0.85);

          const flex = cfg.STIPE_FLEX, stiff = cfg.STIPE_STIFF / flex;
          const seg = p.height / STSEG;

            const wave = Math.sin(t * p.wf + p.phase - i * 0.6) * (0.04 + 0.16 * lift) * flex;
            const mic = micro(wx * 0.01, wy * 0.01, p.phase + 2, t) * cfg.MICRO * 0.13 * flex;

          /* blades — each flows out on its own azimuth, sways + twists */
          for (const b of p.blades) {
            const ia = Math.min(STSEG - 1, Math.floor(b.tA * STSEG)), fr = b.tA * STSEG - ia;
            const A = [P[ia][0] + (P[ia + 1][0] - P[ia][0]) * fr, P[ia][1] + (P[ia + 1][1] - P[ia][1]) * fr, P[ia][2] + (P[ia + 1][2] - P[ia][2]) * fr];

            let bX = 0, bY = 0, ang2 = b.elev;
            const wr = Math.min(1.2, b.wear), bLen = b.len * (1 - Math.min(0.6, wr) * 0.3), bseg = bLen / BLSEG;
            for (let k = 0; k <= BLSEG; k++) {
              const carry = hMag * cfg.CARRY * (0.3 + 0.7 * k / BLSEG);
              const wpx = A[0] + bx * bX + hx * carry, wpy = A[1] + bY, wpz = A[2] + bz * bX + hz * carry;
              P[k] = [wpx, wpy, wpz];
              const sw = tap(b.delayF + k * cfg.BLADE_LAG + b.tA * 0.16);
              const eddy = Math.sin(t * b.wf + b.phase + k * 0.6) * cfg.EDDY;
              const water = Math.max(0, sw + eddy), lift = Math.min(1, water * cfg.LIFT_GAIN);
              const buoyR = Math.sin(b.elev - ang2) * cfg.BUOY * (0.6 + 0.8 * b.buoy);
              const drape = Math.sin(-1.5708 - ang2) * cfg.DRAPE * (k / BLSEG) * (1 - lift);
              const surge = Math.sin(1.5708 - ang2) * (0.75 * lift + 0.25) * cfg.SURGE * (0.5 + 0.9 * b.buoy);
              const wave = Math.sin(t * cfg.WAVE_FREQ + b.phase - k * 0.8) * lift * cfg.WAVE_AMP;
              const mic = micro(wpx * 0.01, wpy * 0.01, b.phase, t) * cfg.MICRO * 0.09 * (0.5 + lift);
              let dA = buoyR + drape + surge + wave + mic; dA = clamp(dA, -0.42, 0.42); ang2 += dA;
              let lg = Math.min(1, 0.24 + 0.6 * lift + 0.26 * p.scl * 0.5); if (b.elder) lg *= 0.55;
              LI[k] = lg;
              const tn = k / BLSEG;
              // REAL 3D TWIST: rotate the strap's width axis around its long axis.
              // long axis ≈ the blade direction in its plane (cos·[bx,0,bz] + sin·up)
              const ca = Math.cos(ang2), sa = Math.sin(ang2);
              const lx = bx * ca, ly = sa, lz = bz * ca;                     // blade forward
              // n = normalize(cross(long, perp)) — the strap's other face axis

              const ct = Math.cos(tw), st = Math.sin(tw);

              const taper = Math.sin(Math.pow(tn, 0.7) * Math.PI) * 1.1 + 0.12;

            }
            ribbon(BLSEG, 1, wr, eye, true);   // real-3D twisting strap
            if (!b.elder && b.buoy > 0.3) quad(A[0], A[1], A[2], b.buoy * 1.2 * p.scl, 2, eye);   // float at base
          }

      },
      _packForest(s) {
        fp.set(s.colStipe, 0); fp.set(s.colBladeLo, 4); fp.set(s.colBladeHi, 8); fp.set(s.colFloat, 12);
        device.queue.writeBuffer(forestBuf, 0, fp);

      _scene: null,
      attachScene(scene) { this._scene = scene; kelpBG = mkKelpBG(scene.viewBuf); return this; },
      computeInto(enc, state) {           // rooted — rebuild the mesh against the shared view + upload
        this._packForest(state);
        const va = this._scene ? this._scene._viewArr : null;
        if (va) { const n = this._build(state, va); device.queue.writeBuffer(vertBuf, 0, vbuf, 0, n * 8); }
      },
      recordInto(pass) { pass.setPipeline(kelpPipe); pass.setBindGroup(0, kelpBG); pass.setVertexBuffer(0, vertBuf); pass.draw(vi); },
      frame(state, viewArr) {

        gpu.ensureTargets();
        const enc = device.createCommandEncoder();
        const swapView = gpu.context.getCurrentTexture().createView();
        const rp = enc.beginRenderPass({
          colorAttachments: [{
            view: gpu.sampleCount > 1 ? gpu.msaaTex.createView() : swapView,
            resolveTarget: gpu.sampleCount > 1 ? swapView : undefined,
            clearValue: { r: 0, g: 0, b: 0, a: 1 }, loadOp: "clear", storeOp: gpu.sampleCount > 1 ? "discard" : "store"

<script>
/* ===== inlined: species/fireflies.js ===== */
/* =============================================================================
   FIREFLIES — ZigGlow 004 · species/fireflies.js · v0.2 (THE HEARTBEAT)
   A field of light in the dark that synchronizes.

   v0.2 delivers the mandate: the ZigPhase law (engine v0.3). Every firefly
   carries a blink oscillator with its own natural frequency; each frame it is

   test/fireflies_sync_ref.mjs — local coherence −0.01 at K=0 → 0.80 at K=2.5.

   THE PERFORMANCE MAPPING (breath = source of life):
     breath  → coupling K. Play, and chaos falls into one rhythm.
               Stop, and the field scatters back to random twinkling.
     strike  → ignition wave: a synchronized pulse expands from the point
               (impulse ring reused; the wavefront yanks phases to the flash)
     bend    → tempo: the whole field's blink rate leans faster/slower
     silence → Climate/Temperament drift — the night never repeats

   Emotional register: intimate wonder. The goosebump is the moment chaos
   resolves into one heartbeat. A room goes quiet, it doesn't gasp.

   Load order: zigcore.js · zigwebgpu.js · species/fireflies.js
   ========================================================================== */
(function (global) {
  "use strict";
  const ZC = global.ZigCore, ZG = global.ZigWebGPU;

  const SEED = 0xF1EF;
  const COUNT = 6000;
  const EXT = 130, EXTY = 130;
  const ANCHOR = [0, 62, 0];

  const Fireflies = global.Fireflies = { version: "0.4.0", flock: null, gpu: null, stage: "loaded", booted: false };   // 0.4: REVIVAL — ghosts (E/D) & wind (F/G), nothing else on purpose
  /* v0.3 — PACEMAKER: your note-on rhythm becomes an oscillator in the graph.

  const withTimeout = (p, ms, what) => Promise.race([p,
    new Promise((_, rej) => setTimeout(() => rej(new Error(what + " stalled (" + (ms / 1000) + "s)")), ms))]);

  function hud(el) {

  }

  Fireflies.boot = async function (canvas, hudEl) {
    const H = hud(hudEl);

    Fireflies.stage = "asking for a WebGPU adapter";
    H.line("status", "asking the browser for a WebGPU adapter + device…");
    if (!global.navigator || !navigator.gpu) {
      H.pill(false, "navigator.gpu missing — use Chrome/Edge; check chrome://gpu");

      H.pill(false, m);

    Fireflies.gpu = gpu;
    gpu.device.lost.then((i) => { H.pill(false, "device lost: " + (i.message || i.reason)); H.line("status", "gate re-closed — reload the node"); });

    Fireflies.stage = "waking ZigCore";
    ZC.Perf.init({ idle: true, onStatus: (s) => H.line("midi", s) });
    ZC.Drive.init({ depth: 8 });
    ZC.Climate.init(SEED);
    ZC.Temperament.init(SEED);
    ZC.Turnover.init(SEED, { slots: 2, interval: 160, departSec: 18, returnSec: 14, reach: 2.6 });
    ZC.Pacemaker.init();

    Fireflies.stage = "compiling the kernel + the phase law";
    H.line("status", "compiling the kernel · waking the oscillators…");
    /* REVIVAL TOUR stop 1 (2026-07-22): this journey deserves exactly two

      dt: 0, time: 0, breath: 0, bend: 0, attack: 0, energy: 0,
      waveSpeed: 26, waveWidth: 9,               // a hush rolling over a meadow
      agitAmbient: 0.08,
      cohW: 0.5, sepW: 3.2, aliW: 0.3,
      anchor: [ANCHOR[0], ANCHOR[1], ANCHOR[2], 16],
      refpt: [0, ANCHOR[1], 0, 6],

      knobsB: [6, 20, 0.5, 0.8],
      impulses, taps, wanderers, wmeta,
      medium: 1,

    const setV4 = (o, a, b, c, d) => { view[o] = a; view[o + 1] = b; view[o + 2] = c; view[o + 3] = d; };
    const GOLD = [0.62, 0.88, 0.28];             // warm green-gold lantern
    const BLUE = [0.30, 0.62, 1.00];             // the cold-blue variant night
    const dial = { Kmax: 3.0, size: 0.9, camRad: 62, fov: 1.0, blue: false, paceGain: 2.2, time: 0.75 };
    let camPhase = 0, hPhase = 0;
    const applyDials = () => {
      const c = dial.blue ? BLUE : GOLD;
      setV4(60, c[0], c[1], c[2], 0.0);          // lantern color
      view[59] = dial.size;                      // birdDark.w = lantern size
    };
    setV4(32, 0.35, 0.62, -0.30, 0.03);          // the faintest moon — dark is the canvas
    setV4(36, 0.002, 0.004, 0.011, 0.0);
    setV4(40, 0.005, 0.008, 0.019, 0.0);
    setV4(44, 0.010, 0.016, 0.028, 0.0);
    setV4(48, 0.003, 0.004, 0.007, 0.0);
    setV4(52, 0.22, 0.27, 0.38, 0.0);

      if (e.code === "BracketLeft") dial.fov = clamp(dial.fov - 0.05, 0.5, 1.4);
      if (e.code === "KeyP") dial.blue = !dial.blue;           // a different night
      if (e.code === "KeyE") after.tau = clamp(after.tau < 0.15 ? 0.15 : after.tau * 1.3, 0, 6);   // E/D — the ghost dial
      if (e.code === "KeyD") { after.tau /= 1.3; if (after.tau < 0.15) after.tau = 0; }
      if (e.code === "KeyF") flow.gain = clamp(flow.gain + 0.2, 0, 3);       // F/G — the meadow wind
      if (e.code === "KeyG") flow.gain = clamp(flow.gain - 0.2, 0, 3);
      if (e.code === "KeyY") dial.paceGain = clamp(dial.paceGain + 0.2, 0, 5);   // Y/H — your pull on the field
      if (e.code === "KeyH") dial.paceGain = clamp(dial.paceGain - 0.2, 0, 5);
      if (e.code === "Comma") dial.time = clamp(dial.time / 1.15, 0.15, 1.6);   // , slower
      if (e.code === "Period") dial.time = clamp(dial.time * 1.15, 0.15, 1.6);  // . faster
      if (e.code === "KeyC") { dial.camRad = 62; dial.fov = 1.0; camPhase = -t * 0.019; hPhase = -t * 0.05; }
      applyDials();
    });
    global.addEventListener("keyup", (e) => { if (e.code === "KeyB") ZC.Perf.sim(0); });
    canvas.addEventListener("pointerdown", (e) => {
      const r = canvas.getBoundingClientRect();
      const nx = ((e.clientX - r.left) / r.width) * 2 - 1;
      const ny = 1 - ((e.clientY - r.top) / r.height) * 2;
      Fireflies.strike(ANCHOR[0] + nx * 70, ANCHOR[1] + ny * 50, ANCHOR[2], 0.9);
    });

    Fireflies.stage = "alive";
    Fireflies.booted = true;
    H.line("status", "alive — hold B (or play) and watch chaos become one heartbeat");
    return { ok: true, flock };
  };

})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
  /* nothing fails invisibly — every error lands on the glass */
  const say = (t) => { const n = document.getElementById("status"); if (n) n.textContent = t; };
  addEventListener("error", (e) => say("script error: " + e.message + " — " +
    ((e.filename || "").split(/[\\/]/).pop() || "?") + ":" + e.lineno));
  addEventListener("unhandledrejection", (e) => say("async error: " +
    ((e.reason && e.reason.message) || e.reason)));

  addEventListener("load", () => {
    if (!window.Fireflies || !window.ZigWebGPU || !window.ZigCore) {
      say("script load failed — missing " + ["ZigCore","ZigWebGPU","Fireflies"]
        .filter((n) => !window[n]).join(", ") + ". Are engine/ and species/ next to this file?");
      return;
    }
    const canvas = document.getElementById("stage");
    Fireflies.boot(canvas, document.getElementById("hud"))
      .catch((e) => { say("boot error: " + (e && e.message || e)); console.error("[fireflies]", e); });
    /* watchdog: if boot hasn't finished in 14s, say where it stopped */
    setTimeout(() => {
      if (!Fireflies.booted) {
        const el = document.getElementById("engine");
        if (el) el.textContent = "watchdog: boot stopped at “" + Fireflies.stage +
          "” — press F12 and send Glyph the Console";
      }
    }, 14000);
  });
</script>
