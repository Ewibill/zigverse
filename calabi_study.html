<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calabi-Yau</title>
<meta name="description" content="A shape from four dimensions, seen in three. Hold to gather it; slide to turn it through the fourth dimension.">
<meta property="og:title" content="Calabi-Yau - a Zigverse study">
<meta property="og:description" content="A shape from four dimensions, seen in three. Hold to gather it; slide to turn it through the fourth.">
<meta name="theme-color" content="#030406">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calabi-Yau">
<link id="icon" rel="apple-touch-icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #030406; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #hud { position: fixed; left: 14px; top: 12px; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #8a93a3; letter-spacing: .02em; pointer-events: none; white-space: pre; }
  #hud b { color: #d8dde6; font-weight: 600; letter-spacing: .12em; }
  html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  .phone #hud { top: calc(env(safe-area-inset-top) + 52px); font-size: 10.5px; white-space: pre-wrap; right: 14px; }
  #intro, #hint { position: fixed; left: 0; right: 0; text-align: center; pointer-events: none; color: #c9cfd9; font: 300 15px/1.5 -apple-system, "Segoe UI", Helvetica, sans-serif; letter-spacing: .04em; transition: opacity 2.4s ease; opacity: 0; }
  #intro { top: calc(env(safe-area-inset-top) + 62px); }
  #intro b { display: block; font-weight: 500; font-size: 13px; letter-spacing: .42em; color: #e8ecf2; margin-bottom: 2px; }
  #intro span, #hint { font-size: 13px; color: #8a93a3; }
  #hint { bottom: calc(env(safe-area-inset-bottom) + 26px); }
  #info { position: fixed; right: 10px; top: calc(env(safe-area-inset-top) + 10px); width: 34px; height: 34px; border-radius: 17px; border: 1px solid #39404c; background: rgba(3,4,6,.5); color: #8a93a3; font: italic 15px Georgia, serif; display: none; }
  .phone #info { display: block; }
  #listen { position: fixed; right: 10px; top: calc(env(safe-area-inset-top) + 10px); height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid #39404c; background: rgba(3,4,6,.5); color: #8a93a3; font: 13px -apple-system, "Segoe UI", Helvetica, sans-serif; letter-spacing: .06em; }
  .phone #listen { right: 52px; }
  #listen.on { color: #e8ecf2; border-color: #8fa3b8; }
  .show { opacity: 1 !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="intro"><b>CALABI-YAU</b><span>a shape from four dimensions, seen in three</span></div>
<div id="hint">hold to gather &middot; slide to turn it through the fourth dimension<br>double-tap for another shape &middot; or tap listen and play to it</div>
<button id="info" aria-label="about">i</button>
<button id="listen" aria-label="listen with the microphone">listen</button>
<script src="engine/zigcore.js"></script>
<script src="engine/zigmanifold.js"></script>
<script>
/* =============================================================================
   CALABI-YAU STUDY v0.1 (2026-09-28) — a one-off STUDY, not a species.
   Question it exists to answer (Bill's kill criterion): does a shape turning
   through a dimension it does not have read as "what IS that?" - or as math
   art / screensaver? If the latter, park it.
     the shape    the Fermat surface z1^n + z2^n = 1 (n = 5: the famous
                  quintic slice), projected from four real dimensions
     BEND         turns it through the fourth dimension (the projection angle)
     BREATH       gathers the shards onto the surface; silence loosens them
                  into a cloud that still remembers the shape
     keys         B hold = breath · <- -> turn by hand · 3 4 5 = degree n
                  space = pause the slow drift · H = hide this text
                  drag = orbit · wheel = zoom
   Geometry: engine/zigmanifold.js (reusable; test/manifold_ref.mjs).
   Input: ZigCore.Perf (the same EWI path as the engine).
   Renderer: WebGL2 - runs on any machine and on the phone.
   PHONE (v0.2, 2026-09-29): a finger is the breath. Hold = gather, slide
   sideways = turn through the 4th dimension, slide up/down = tilt, two
   fingers = orbit + pinch zoom, double-tap = next degree (5 -> 3 -> 4).
   A quality governor drops the shard count if the phone cannot hold ~40 fps;
   portrait framing pulls the camera back so the whole shape fits. "Add to
   Home Screen" opens it full-screen with its own icon (cut from the canvas).
   LISTEN (v0.3, 2026-09-29): a button, OFF by default, so a stranger never
   meets a microphone prompt unasked. Tapped, it opens the mic through the
   engine's own ears (ZigCore.Timbre: auto-levelled for a phone or laptop mic,
   never for the MOTU). Sound becomes breath (loudness gathers the shape),
   brightness - a higher or brighter note - turns it through the 4th dimension,
   and an attack scatters the shards for a moment before they settle. The EWI
   over MIDI still wins; a finger still works. Tap again (or M) = stop.
   PLAYED (v0.4, 2026-09-29): Bill played it and wanted more response. The EWI
   gives more than breath and bend, and v0.3 ignored the rest:
     PITCH    turns it through the 4th dimension - a melody is a PATH. About
              1.1 rad per octave around the centre of your own range (the first
              note sets it, then it follows your tessitura slowly, ~20 s). In
              silence the last turn is held (memory), then relaxes over ~6 s.
     ATTACK   each note-on scatters the shards a little - articulation shows.
     SUSTAIN  a held note glows (iridescence) and pulls the shape tighter.
     BREATH   swells the body (+8% at full breath) as well as gathering it.
   Bend still turns on top of pitch.
   ========================================================================== */
(function () {
  const ZC = window.ZigCore, ZM = window.ZigManifold, Perf = ZC.Perf;
  const cv = document.getElementById("c"), hud = document.getElementById("hud");
  const PHONE = matchMedia("(pointer: coarse)").matches || /(\?|#|&)phone\b/.test(location.hash);
  if (PHONE) document.documentElement.classList.add("phone");
  const gl = cv.getContext("webgl2", { antialias: true, premultipliedAlpha: false, preserveDrawingBuffer: !PHONE });
  window.CalabiStudy = { booted: false, frames: 0, phone: PHONE };
  if (!gl) { hud.textContent = "WebGL2 is not available in this browser."; return; }

  /* ---- the shard: a lens, like the engine's petals ---------------------- */
  const SH = []; const SEG = 10;
  for (let k = 0; k < SEG; k++) {                      // lens outline in (s along, w across)
    const a0 = Math.PI * k / SEG, a1 = Math.PI * (k + 1) / SEG;
    const pt = (a, side) => [Math.cos(a), side * 0.34 * Math.sin(a)];
    const u0 = pt(a0, 1), u1 = pt(a1, 1), d0 = pt(a0, -1), d1 = pt(a1, -1);
    SH.push(0, 0, u0[0], u0[1], u1[0], u1[1], 0, 0, d1[0], d1[1], d0[0], d0[1]);
  }
  const VS = `#version 300 es
  layout(location=0) in vec2 aL;
  layout(location=1) in vec3 aP; layout(location=2) in vec3 aN; layout(location=3) in vec3 aT; layout(location=4) in float aS;
  uniform mat4 uVP; uniform vec3 uEye; uniform float uSize;
  out vec3 vN; out vec3 vW; out float vS; out float vU;
  void main() {
    vec3 n = normalize(aN), t = normalize(aT - n * dot(aT, n)), b = cross(n, t);
    float sz = uSize * (0.75 + 0.5 * aS);
    vec3 w = aP + (t * aL.x + b * aL.y) * sz + n * (1.0 - aL.x * aL.x) * sz * 0.10;   // a slight cup
    vN = n; vW = w; vS = aS; vU = aL.x;
    gl_Position = uVP * vec4(w, 1.0);
  }`;
  const FS = `#version 300 es
  precision highp float;
  in vec3 vN; in vec3 vW; in float vS; in float vU;
  uniform vec3 uEye; uniform vec3 uSun; uniform float uIri; uniform float uHue;
  out vec4 o;
  void main() {
    vec3 n = normalize(vN); if (!gl_FrontFacing) n = -n;
    vec3 v = normalize(uEye - vW);
    float d = dot(n, normalize(uSun));
    float lit = smoothstep(-0.08, 0.45, d);                          // a firm terminator (SOLID)
    vec3 moss = vec3(0.10, 0.12, 0.13), bone = vec3(0.86, 0.84, 0.80);
    vec3 base = gl_FrontFacing ? moss : bone;
    vec3 c = base * (0.05 + 1.05 * lit) * vec3(0.72, 0.78, 0.95);
    float graze = pow(1.0 - abs(dot(n, v)), 1.6);
    vec3 hue = 0.5 + 0.5 * cos(6.2831 * (uHue + graze * 0.9 + vU * 0.25 + vS * 0.12 + vec3(0.0, 0.33, 0.66)));
    c += hue * graze * uIri;                                         // thin-film at the turning edge
    vec3 h = normalize(v + normalize(uSun));
    c += vec3(0.9, 0.92, 1.0) * pow(max(dot(n, h), 0.0), 60.0) * 0.6 * lit;
    float fog = exp(-0.018 * length(uEye - vW) * length(uEye - vW) * 0.02);
    o = vec4(mix(vec3(0.012, 0.014, 0.02), c, fog), 1.0);
  }`;
  const sh = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; };
  const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  const U = (n) => gl.getUniformLocation(prog, n);
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const bShape = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bShape); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(SH), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const bInst = gl.createBuffer();

  /* ---- the field --------------------------------------------------------- */
  let n = 5, S = null, N = 0, P, V, T, TN, TU, seed, inst;
  const FIXED = /(\?|#|&)count=(\d+)/.exec(location.hash); let COUNT = FIXED ? +FIXED[2] : 6000;
  function build(deg) {
    n = deg; S = ZM.sample(n, COUNT, 1.0); const old = P, oldN = N; N = S.count;
    P = new Float32Array(3 * N); V = new Float32Array(3 * N); T = new Float32Array(3 * N); TN = new Float32Array(3 * N); TU = new Float32Array(3 * N);
    seed = new Float32Array(N); for (let i = 0; i < N; i++) { const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; seed[i] = x - Math.floor(x); }
    for (let i = 0; i < N; i++) { const j = old ? i % oldN : -1;
      if (old) { for (let c = 0; c < 3; c++) P[3 * i + c] = old[3 * j + c]; continue; }
      const u = Math.random() * 2 - 1, ph = Math.random() * 6.2832, r = 2.4 * Math.cbrt(Math.random()), q = Math.sqrt(1 - u * u);   // a soft ball, not a box
      P[3 * i] = r * q * Math.cos(ph); P[3 * i + 1] = r * u; P[3 * i + 2] = r * q * Math.sin(ph); }
    inst = new Float32Array(10 * N);
    gl.bindBuffer(gl.ARRAY_BUFFER, bInst); gl.bufferData(gl.ARRAY_BUFFER, inst.byteLength, gl.DYNAMIC_DRAW);
    const st = 40; [[1, 3, 0], [2, 3, 12], [3, 3, 24], [4, 1, 36]].forEach(([loc, sz, off]) => {
      gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, sz, gl.FLOAT, false, st, off); gl.vertexAttribDivisor(loc, 1); });
  }
  build(5);

  /* ---- input ------------------------------------------------------------- */
  let ewi = "EWI: looking…";
  Perf.init({ idle: true, onStatus: (s) => { ewi = s; } });
  let handTurn = 0, paused = false, showHud = !PHONE, yaw = 0.6, pitch = 0.35, dist = 7.6, drag = null;
  let touchB = 0, touched = false, lastTap = 0; const fingers = new Map(); let pinch0 = 0, mid0 = null;
  addEventListener("keydown", (e) => {
    if (e.repeat) return;
    if (e.code === "KeyB") Perf.sim(0.85);
    if (e.code === "Space") { paused = !paused; e.preventDefault(); }
    if (e.code === "KeyH") showHud = !showHud;
    if (e.code === "Digit3" || e.code === "Digit4" || e.code === "Digit5") build(+e.code.slice(-1));
  });
  const keys = new Set(); addEventListener("keydown", (e) => keys.add(e.code)); addEventListener("keyup", (e) => { keys.delete(e.code); if (e.code === "KeyB") Perf.sim(0); });
  /* mouse: drag orbits (as v0.1). touch: the finger IS the breath. */
  const two = () => { const [a, b] = [...fingers.values()]; return [Math.hypot(a[0] - b[0], a[1] - b[1]), [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]]; };
  cv.addEventListener("pointerdown", (e) => {
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    if (e.pointerType === "mouse") { drag = [e.clientX, e.clientY]; return; }
    const now = performance.now();
    if (fingers.size === 0) { if (now - lastTap < 320) { build(n === 5 ? 3 : n === 3 ? 4 : 5); lastTap = 0; } else lastTap = now; }
    fingers.set(e.pointerId, [e.clientX, e.clientY]); touched = true;
    if (fingers.size === 2) { [pinch0, mid0] = two(); }
  });
  cv.addEventListener("pointermove", (e) => {
    if (e.pointerType === "mouse") { if (!drag) return; yaw -= (e.clientX - drag[0]) * 0.005; pitch = Math.max(-1.3, Math.min(1.3, pitch + (e.clientY - drag[1]) * 0.005)); drag = [e.clientX, e.clientY]; return; }
    const f = fingers.get(e.pointerId); if (!f) return;
    const dx = e.clientX - f[0], dy = e.clientY - f[1]; fingers.set(e.pointerId, [e.clientX, e.clientY]);
    if (Math.abs(dx) + Math.abs(dy) > 6) lastTap = 0;                     // a slide is not a tap
    if (fingers.size === 1) { handTurn += dx * 0.006; pitch = Math.max(-1.3, Math.min(1.3, pitch + dy * 0.004)); }
    else if (fingers.size === 2) { const [d, m] = two();
      if (pinch0 > 0) dist = Math.max(2.2, Math.min(12, dist * pinch0 / Math.max(1, d)));
      yaw -= (m[0] - mid0[0]) * 0.006; pinch0 = d; mid0 = m; }
  });
  const up = (e) => { if (e.pointerType === "mouse") { drag = null; return; } fingers.delete(e.pointerId); if (fingers.size < 2) pinch0 = 0; };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  document.getElementById("info").addEventListener("click", () => { showHud = !showHud; });
  /* ---- LISTEN: the engine's ears, opt-in ------------------------------------ */
  const TB = ZC.Timbre, lbtn = document.getElementById("listen");
  let noteSeen = -1, noteRef = -1, noteTarget = 0, noteTurn = 0, sustainG = 0;   // PLAYED
  let listening = false, arming = false, refSet = false, soundB = 0, brightS = 0.5, brightRef = 0.5, soundTurn = 0, kick = 0, heard = "";
  async function toggleListen() {
    if (arming) return;
    if (listening) { listening = false; try { TB._ctx && TB._ctx.suspend(); } catch (_) {} lbtn.classList.remove("on"); lbtn.textContent = "listen"; return; }
    if (TB.live) { try { await TB._ctx.resume(); } catch (_) {} listening = true; lbtn.classList.add("on"); lbtn.textContent = "listening"; return; }
    arming = true; lbtn.textContent = "…";
    const ok = await TB.arm(/M2|MOTU/i);
    arming = false;
    if (!ok) { lbtn.textContent = "no mic"; heard = TB.err; setTimeout(() => { if (!listening) lbtn.textContent = "listen"; }, 2500); return; }
    TB.trim = 1; TB.auto = !TB.iface;                                // a phone/laptop mic is auto-levelled; the MOTU never is
    try { if (TB._ctx.state !== "running") await TB._ctx.resume(); } catch (_) {}
    listening = true; heard = TB.device; lbtn.classList.add("on"); lbtn.textContent = "listening";
  }
  lbtn.addEventListener("click", (e) => { e.stopPropagation(); toggleListen(); });
  addEventListener("keydown", (e) => { if (e.code === "KeyM" && !e.repeat) toggleListen(); });
  /* iOS can hand back a suspended audio clock; any touch wakes it */
  addEventListener("pointerdown", () => { if (listening && TB._ctx && TB._ctx.state !== "running") TB._ctx.resume().catch(() => {}); }, true);
  cv.addEventListener("wheel", (e) => { dist = Math.max(2.2, Math.min(12, dist * (1 + e.deltaY * 0.001))); e.preventDefault(); }, { passive: false });

  /* ---- matrices ---------------------------------------------------------- */
  const persp = (f, a, nr, fr) => { const t = 1 / Math.tan(f / 2); return [t / a, 0, 0, 0, 0, t, 0, 0, 0, 0, (fr + nr) / (nr - fr), -1, 0, 0, 2 * fr * nr / (nr - fr), 0]; };
  const look = (e, c) => { const z = norm(sub(e, c)), x = norm(cross([0, 1, 0], z)), y = cross(z, x);
    return [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -dot(x, e), -dot(y, e), -dot(z, e), 1]; };
  const mulM = (a, b) => { const r = new Array(16).fill(0); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) for (let k = 0; k < 4; k++) r[j * 4 + i] += a[k * 4 + i] * b[j * 4 + k]; return r; };
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]], norm = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

  /* ---- the loop ---------------------------------------------------------- */
  const SUP = { 3: "\u00b3", 4: "\u2074", 5: "\u2075" };
  const gov = { t: 0, k: 0, drops: 0 }; const intro = document.getElementById("intro"), hint = document.getElementById("hint"); let tTouch = -1;
  let last = performance.now(), t = 0, alpha = 0.6, drift = PHONE ? 0.9 : 0,   /* the phone opens at the classic angle, not the cube-like one */ bendS = 0, gather = 0.5, hue = 0.33;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
    Perf.update(dt, t);
    if (keys.has("ArrowLeft")) handTurn -= dt * 0.9; if (keys.has("ArrowRight")) handTurn += dt * 0.9;
    if (!paused) drift += dt * 0.05;
    bendS += (Perf.bend - bendS) * Math.min(1, dt * 3);
    /* LISTEN: loudness is breath; brightness (a higher / brighter note) turns it;
       an attack kicks the shards loose for a moment. Gated so a quiet room stays still. */
    if (listening) {
      TB.update(dt);
      const sb = Math.max(0, Math.min(1, (TB.body - 0.08) / 0.5));
      soundB += (sb - soundB) * Math.min(1, dt * (sb > soundB ? 6 : 1.2));
      brightS += (TB.brightness - brightS) * Math.min(1, dt * 4);
      if (soundB > 0.15) { if (!refSet) { brightRef = brightS; refSet = true; }        // the first sound sets the centre...
        brightRef += (brightS - brightRef) * Math.min(1, dt * 0.15); }                 // ...then the voice's own centre is learned slowly
      soundTurn += (Math.max(-1.2, Math.min(1.2, (brightS - brightRef) * 3.0)) * Math.min(1, soundB * 2) - soundTurn) * Math.min(1, dt * 2.5);
      kick = Math.max(kick * Math.exp(-dt / 0.35), soundB > 0.1 ? TB.flux : 0);
    } else { soundB *= Math.exp(-dt / 0.8); soundTurn *= Math.exp(-dt / 1.2); kick *= Math.exp(-dt / 0.35); }
    /* PLAYED: pitch is a path through the 4th dimension; attack scatters; a held note glows */
    if (Perf.live && Perf.lastNote >= 0) {
      if (Perf.lastNote !== noteSeen) { noteSeen = Perf.lastNote; if (noteRef < 0) noteRef = noteSeen; }
      noteRef += (noteSeen - noteRef) * Math.min(1, dt * 0.05);                           // follow the tessitura, slowly
      noteTarget = Math.max(-1.6, Math.min(1.6, (noteSeen - noteRef) / 12 * 1.1));
      kick = Math.max(kick, 0.6 * Perf.attack);
    } else noteTarget *= Math.exp(-dt / 6);                                                 // silence: hold the turn, then let it relax
    noteTurn += (noteTarget - noteTurn) * Math.min(1, dt * 2.2);                           // a glide, like portamento
    sustainG += (Math.min(1, Perf.holdSec / 2.5) * (Perf.held.size > 0 ? 1 : 0) - sustainG) * Math.min(1, dt * 2);
    alpha = drift + handTurn + bendS * 1.6 + soundTurn + noteTurn;             // BEND (or a brighter note) turns it through the 4th dimension
    const live = Perf.live || Perf._sim > 0;
    const hold = fingers.size > 0 ? 1 : 0;
    touchB += (hold - touchB) * Math.min(1, dt * (hold ? 1.4 : 0.9));   // a held finger breathes in; lifting it lets go, slower
    /* on the phone nobody is playing, so the idle auto-breath would gather it
       on its own - there, the finger is the only breath (the EWI still wins) */
    const breathIn = live ? Perf.breath : (PHONE || listening) ? Math.max(touchB, soundB) : Math.max(Perf.breath, touchB);
    const wantG = Math.min(1, (PHONE && !live ? 0.32 : 0.25) + 0.95 * breathIn + 0.12 * sustainG);
    gather += (wantG - gather) * Math.min(1, dt * (wantG > gather ? 2.0 : 0.6));
    hue += dt * 0.01;

    ZM.frame(S, alpha, 1.35 * (1 + 0.08 * breathIn), T, TN);                      // breath swells the body
    const ca = Math.cos(alpha), sa = Math.sin(alpha);
    const k = 1.2 + 9.0 * gather, damp = 2.2 + 2.0 * gather, cloud = (1 - gather) * 0.55 + kick * 0.35;
    for (let i = 0; i < N; i++) {
      const o = 3 * i, s = seed[i];
      const nx = Math.sin(t * 0.31 + s * 17.0 + P[o + 1] * 1.7), ny = Math.sin(t * 0.27 + s * 11.0 + P[o + 2] * 1.9), nz = Math.sin(t * 0.23 + s * 23.0 + P[o] * 1.5);
      const tx = T[o] + nx * cloud, ty = T[o + 1] + ny * cloud, tz = T[o + 2] + nz * cloud;
      V[o] += ((tx - P[o]) * k - V[o] * damp) * dt; V[o + 1] += ((ty - P[o + 1]) * k - V[o + 1] * damp) * dt; V[o + 2] += ((tz - P[o + 2]) * k - V[o + 2] * damp) * dt;
      P[o] += V[o] * dt; P[o + 1] += V[o + 1] * dt; P[o + 2] += V[o + 2] * dt;
      const q = 4 * i; const ux = S.qx[q], uy = S.qx[q + 2], uz = ca * S.qx[q + 1] + sa * S.qx[q + 3];
      const b = 10 * i;

    }

    const dpr = PHONE ? Math.min(2, devicePixelRatio) : devicePixelRatio;

    }

    hud.innerHTML = showHud
      ? "<b>CALABI-YAU STUDY</b>  v0.4\nthe Fermat surface z\u2081" + SUP[n] + " + z\u2082" + SUP[n] + " = 1, a slice of a Calabi-Yau space,\nprojected from four dimensions into this room\n\n" +
        "n " + n + " · " + N + " shards · 4th-dimension turn " + alpha.toFixed(2) + " rad" + (paused ? " (drift paused)" : "") + "\n" +
        (live ? "LIVE" : listening ? "LISTEN" : "idle") + " · breath " + "▮".repeat(Math.round(breathIn * 10)).padEnd(10, "▯") + " · gathered " + Math.round(gather * 100) + "% · bend " + Perf.bend.toFixed(2) + "\n" + (listening ? "listening · " + heard + " · sound " + "▮".repeat(Math.round(soundB * 10)).padEnd(10, "▯") + (TB.auto ? " (auto-level x" + TB.gain.toFixed(1) + ")" : "") + "\n" : "") + (PHONE && !live ? "your finger is the breath" + (gov.drops ? " · shards " + N + " (tuned for this phone)" : "") : ewi) + "\n\n" +
        (PHONE ? "hold = gather · slide = turn it through the 4th dimension · double-tap = another degree · two fingers = orbit / zoom · listen = let it hear you\n\nThe maths is real (every point lies on the surface). Whether hidden dimensions of our universe look like this is string theory, and untested."
               : "pitch + bend = turn it through the 4th dimension · breath = gather + swell · attack = scatter · a held note = glow\nB breath · ← → turn · 3 4 5 degree · space drift · H hide · M listen · drag/wheel view")
      : "";
    window.CalabiStudy.frames++; window.CalabiStudy.booted = true; window.CalabiStudy.alpha = alpha; window.CalabiStudy.gather = gather; window.CalabiStudy.n = n; window.CalabiStudy.N = N; window.CalabiStudy.touchB = touchB; window.CalabiStudy.dropped = gov.drops; window.CalabiStudy.fingers = fingers.size; window.CalabiStudy.listening = listening; window.CalabiStudy.soundB = soundB; window.CalabiStudy.soundTurn = soundTurn; window.CalabiStudy.kick = kick; window.CalabiStudy.noteTurn = noteTurn; window.CalabiStudy.sustainG = sustainG;
